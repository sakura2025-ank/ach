        // =========================================================
        // ★★★ 制御ロジック（フィルタ・ページネーション・ランダム） ★★★
        // =========================================================

        // 配列をランダムにシャッフルする関数
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // ページロード時にシャッフル実行
        shuffleArray(commentsData);
        
        const itemsPerPage = 10;
        let currentPage = 1;
        let filteredData = [...commentsData]; // 初期状態は全データ（シャッフル済み）

        const commentsArea = document.getElementById('comments-area');
        const paginationContainer = document.getElementById('pagination-container');
        const noResultDiv = document.getElementById('noResult');

        // 監視オプション
        const options = { root: null, rootMargin: "0px 0px -20% 0px", threshold: 0 };
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, options);

        // 検索機能
        function filterData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!query) {
                // 空なら全件（現在のシャッフル状態を維持）
                filteredData = [...commentsData];
            } else {
                // 名前 OR 推しキャラ名でフィルタ（大文字小文字無視、部分一致）
                filteredData = commentsData.filter(item => 
                    item.name.toLowerCase().includes(query) ||
                    item.oshi.toLowerCase().includes(query)
                );
            }

            // ページを1に戻して再描画
            currentPage = 1;
            renderPage(currentPage);
        }

        // ページを描画する関数
        function renderPage(page) {
            commentsArea.innerHTML = "";
            
            // 検索結果がない場合
            if (filteredData.length === 0) {
                noResultDiv.style.display = 'block';
                paginationContainer.innerHTML = ''; // ページネーションも消す
                return;
            } else {
                noResultDiv.style.display = 'none';
            }

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredData.slice(start, end);

            pageData.forEach(data => {
                const html = `
                    <div class="comment-item ${data.type}">
                        <div class="icon">${data.icon}</div>
                        <div>
                            <div class="bubble-content">
                                【君とつないだ30周年、サクラ大戦への愛を一言！】<br><strong>${data.oshi}</strong><br>
                                 <br>
                            </div>
                            <div class="meta-info">${data.name}</div>
                        </div>
                    </div>
                `;
                commentsArea.insertAdjacentHTML('beforeend', html);
            });

            // アニメーション適用
            setTimeout(() => {
                document.querySelectorAll('.comment-item').forEach(item => {
                    observer.observe(item);
                });
            }, 50);

            // ページネーション作成
            createPagination();
            
            // ページトップへスクロール
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 番号付きページネーション生成
        function createPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);

            // 1ページのみならページネーション不要
            if (totalPages <= 1) return;

            // 「前へ」ボタン
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '＜';
            prevBtn.className = 'nav-btn';
            prevBtn.disabled = (currentPage === 1);
            prevBtn.onclick = () => changePage(-1);
            paginationContainer.appendChild(prevBtn);

            // 数字ボタン
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.onclick = () => {
                    currentPage = i;
                    renderPage(currentPage);
                };
                paginationContainer.appendChild(btn);
            }

            // 「次へ」ボタン
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '＞';
            nextBtn.className = 'nav-btn';
            nextBtn.disabled = (currentPage === totalPages);
            nextBtn.onclick = () => changePage(1);
            paginationContainer.appendChild(nextBtn);
        }

        // 前後移動用
        function changePage(delta) {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage(currentPage);
            }
        }

        // 初期表示
        renderPage(currentPage);

    </script>
