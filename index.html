        .icon {

        .bubble-content {
            max-width: 100%; padding: 15px 20px; position: relative;
            font-size: 15px; line-height: 1.6;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3); color: #593030;

        .bubble-content::after {
            content: ''; position: absolute; width: 20px; height: 20px;
            background-color: #ff9eb5; border-radius: 100% 0 100% 0;
            opacity: 0.8; pointer-events: none;
        }
        .meta-info { font-size: 11px; color: #a07070; margin: 6px 8px 0; }

        .comment-item.left .bubble-content {
            background: linear-gradient(135deg, #fff0f5 0%, #ffdde6 100%);
            border: 1px solid #ffccd7; margin-left: 15px;
            border-radius: 20px 40px 20px 2px; 
        }
        .comment-item.left .icon { background-color: #e090a0; }
        .comment-item.left .bubble-content::after {
            top: -8px; right: -8px; transform: rotate(-15deg);

        .comment-item.right { flex-direction: row-reverse; }
        .comment-item.right .bubble-content {
            background: linear-gradient(135deg, #fafff5 0%, #ecf7e4 100%);
            border: 1px solid #d0e0c0; margin-right: 15px;
            border-radius: 40px 20px 2px 20px;

        .comment-item.right .bubble-content::after {
            background-color: #a0d080; top: -8px; left: -8px; transform: rotate(75deg);

            color: #d64a6e;

        // =========================================================
        // ★★★ 制御ロジック（フィルタ・ページネーション・ランダム） ★★★
        // =========================================================

        // 配列をランダムにシャッフルする関数
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // ページロード時にシャッフル実行
        shuffleArray(commentsData);
        
        const itemsPerPage = 10;
        let currentPage = 1;
        let filteredData = [...commentsData]; // 初期状態は全データ（シャッフル済み）

        const commentsArea = document.getElementById('comments-area');
        const paginationContainer = document.getElementById('pagination-container');
        const noResultDiv = document.getElementById('noResult');

        // 監視オプション
        const options = { root: null, rootMargin: "0px 0px -20% 0px", threshold: 0 };
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, options);

        // 検索機能（修正済み）
        function filterData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!query) {
                // 空なら全件（現在のシャッフル状態を維持）
                filteredData = [...commentsData];
            } else {
                // 名前 OR 推しキャラ名でフィルタ（大文字小文字無視、部分一致）
                filteredData = commentsData.filter(item => 
                    item.name.toLowerCase().includes(query) ||
                    item.oshi.toLowerCase().includes(query)
                );
            }

            // ページを1に戻して再描画
            currentPage = 1;
            renderPage(currentPage);
        }

        // ページを描画する関数
        function renderPage(page) {
            commentsArea.innerHTML = "";
            
            // 検索結果がない場合
            if (filteredData.length === 0) {
                noResultDiv.style.display = 'block';
                paginationContainer.innerHTML = ''; // ページネーションも消す
                return;
            } else {
                noResultDiv.style.display = 'none';
            }

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredData.slice(start, end);

            pageData.forEach(data => {
                const html = `
                    <div class="comment-item ${data.type}">
                        <div class="icon">${data.icon}</div>
                        <div>
                            <div class="bubble-content">
                                【推しキャラ】<br><strong>${data.oshi}</strong><br>
                                【1を選んだ理由】<br>${data.q1}<br>
                                【一番記憶に残るシーン】<br>${data.q2}<br>
                                【3の理由】<br>${data.q3}
                            </div>
                            <div class="meta-info">${data.name}</div>
                        </div>
                    </div>
                `;
                commentsArea.insertAdjacentHTML('beforeend', html);
            });

            // アニメーション適用
            setTimeout(() => {
                document.querySelectorAll('.comment-item').forEach(item => {
                    observer.observe(item);
                });
            }, 50);

            // ページネーション作成
            createPagination();
            
            // ページトップへスクロール
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 番号付きページネーション生成
        function createPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);

            // 1ページのみならページネーション不要
            if (totalPages <= 1) return;

            // 「前へ」ボタン
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '＜';
            prevBtn.className = 'nav-btn';
            prevBtn.disabled = (currentPage === 1);
            prevBtn.onclick = () => changePage(-1);
            paginationContainer.appendChild(prevBtn);

            // 数字ボタン
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.onclick = () => {
                    currentPage = i;
                    renderPage(currentPage);
                };
                paginationContainer.appendChild(btn);
            }

            // 「次へ」ボタン
            const nextBtn = document.createElement('button');
            nextBtn.textContent = '＞';
            nextBtn.className = 'nav-btn';
            nextBtn.disabled = (currentPage === totalPages);
            nextBtn.onclick = () => changePage(1);
            paginationContainer.appendChild(nextBtn);
        }

        // 前後移動用
        function changePage(delta) {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage(currentPage);
            }
        }

        // 初期表示
        renderPage(currentPage);

    </script>
