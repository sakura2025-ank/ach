        .bubble-content {
            max-width: 100%; padding: 15px 20px; position: relative;
            font-size: 15px; line-height: 1.6;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3); color: #593030;
        }
        .bubble-content strong { color: #d64a6e; font-weight: bold; }
        
        /* 花びら装飾 */
        .bubble-content::after {
            content: ''; position: absolute; width: 20px; height: 20px;
            background-color: #ff9eb5; border-radius: 100% 0 100% 0;
            opacity: 0.8; pointer-events: none;
        }
        .meta-info { font-size: 11px; color: #a07070; margin: 6px 8px 0; }

        /* --- 左（通常） --- */
        .comment-item.left .bubble-content {
            background: linear-gradient(135deg, #fff0f5 0%, #ffdde6 100%);
            border: 1px solid #ffccd7; margin-left: 15px;
            border-radius: 20px 40px 20px 2px; 
        }
        .comment-item.left .icon { background-color: #e090a0; }
        .comment-item.left .bubble-content::after {
            top: -8px; right: -8px; transform: rotate(-15deg);
        }

        .comment-item.right { flex-direction: row-reverse; }
        .comment-item.right .bubble-content {
            background: linear-gradient(135deg, #fafff5 0%, #ecf7e4 100%);
            border: 1px solid #d0e0c0; margin-right: 15px;
            border-radius: 40px 20px 2px 20px;
        }
        .comment-item.right .meta-info { text-align: right; }
        .comment-item.right .icon { background-color: #88c070; }
        .comment-item.right .bubble-content::after {

        // =========================================================
        // ★★★ ページネーション（ページ切り替え）の制御 ★★★
        // =========================================================
        
        const itemsPerPage = 10; // ★1ページに表示する数（ここを変更できます）
        let currentPage = 1;

        const commentsArea = document.getElementById('comments-area');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // 監視の設定オプション
        const options = { root: null, rootMargin: "0px 0px -20% 0px", threshold: 0 };
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, options);

        // ページを描画する関数
        function renderPage(page) {
            // 表示エリアをクリア
            commentsArea.innerHTML = "";
            
            // 全データから、今回のページに表示する分だけを切り出す
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = commentsData.slice(start, end);

            // データをHTMLにして追加
            pageData.forEach(data => {
                const html = `
                    <div class="comment-item ${data.type}">
                        <div class="icon">${data.icon}</div>
                        <div>
                            <div class="bubble-content">
                                【推しキャラ】<br><strong>${data.oshi}</strong><br>
                                【1を選んだ理由】<br>${data.q1}<br>
                                【一番記憶に残るシーン】<br>${data.q2}<br>
                                【3の理由】<br>${data.q3}
                            </div>
                            <div class="meta-info">${data.name}</div>
                        </div>
                    </div>
                `;
                commentsArea.insertAdjacentHTML('beforeend', html);
            });

            // 新しく追加された要素をアニメーション監視対象にする
            setTimeout(() => {
                document.querySelectorAll('.comment-item').forEach(item => {
                    observer.observe(item);
                });
            }, 50);

            // ボタンの状態とページ番号の表示を更新
            updatePaginationControls();
            
            // ページトップへスクロール（切り替え時に上に戻す）
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ページ送りボタンの更新
        function updatePaginationControls() {
            const totalPages = Math.ceil(commentsData.length / itemsPerPage);
            
            pageInfo.textContent = `${currentPage} / ${totalPages}`;
            
            // 1ページ目なら「前へ」を無効化
            prevBtn.disabled = (currentPage === 1);
            
            // 最後のページなら「次へ」を無効化
            nextBtn.disabled = (currentPage === totalPages);
        }

        // ボタンが押された時の処理
        function changePage(delta) {
            const totalPages = Math.ceil(commentsData.length / itemsPerPage);
            const newPage = currentPage + delta;

            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPage(currentPage);
            }
        }

        // ★最初の実行（1ページ目を表示）
        renderPage(currentPage);

    </script>
